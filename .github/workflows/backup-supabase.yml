
name: Malborska S3 Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malborska-s3-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL 17 and AWS CLI
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl unzip

          sudo install -d \
            /usr/share/postgresql-common/pgdg

          sudo curl --fail --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

          echo "Types: deb" | sudo tee \
            /etc/apt/sources.list.d/pgdg.sources
          echo "URIs: https://apt.postgresql.org/pub/repos/apt" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Suites: noble-pgdg" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Components: main" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version

          curl --fail --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o /tmp/awscliv2.zip

          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install --update

          aws --version

      - name: Run Supabase backup
        id: supabase_backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_BACKUP_PREFIX: ${{ vars.S3_BACKUP_PREFIX }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          bash scripts/backup_supabase.sh

      - name: Report backup result to New Relic
        if: ${{ always() }}
        continue-on-error: true
        env:
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          BACKUP_RESULT: ${{ job.status }}
          BACKUP_STEP_RESULT: ${{ steps.supabase_backup.outcome }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.request

          key = os.environ["NEW_RELIC_LICENSE_KEY"]

          event = {
              "eventType": "MalborskaBackup",
              "status": os.environ["BACKUP_RESULT"],
              "backupStepStatus": os.environ["BACKUP_STEP_RESULT"],
              "workflow": "backup-supabase",
              "runId": os.environ["GITHUB_RUN_ID"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "commitSha": os.environ["GITHUB_SHA"],
          }

          request = urllib.request.Request(
              "https://insights-collector.eu01.nr-data.net/v1/accounts/8654524/events",
              data=json.dumps([event]).encode("utf-8"),
              headers={
                  "Api-Key": key,
                  "Content-Type": "application/json",
              },
              method="POST",
          )

          with urllib.request.urlopen(request, timeout=15) as response:
              print(f"New Relic event HTTP status: {response.status}")

          print(f"Reported backup status: {event['status']}")
          PY
