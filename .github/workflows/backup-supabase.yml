
name: Malborska S3 Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malborska-s3-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL and AWS CLI
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            postgresql-client awscli

      - name: Run Supabase backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_BACKUP_PREFIX: ${{ vars.S3_BACKUP_PREFIX }}
        run: bash scripts/backup_supabase.sh
