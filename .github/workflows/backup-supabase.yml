
name: Malborska S3 Backup

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: malborska-s3-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      
      - name: Install PostgreSQL 17 and AWS CLI
        run: |
          set -euo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            ca-certificates curl unzip

          sudo install -d \
            /usr/share/postgresql-common/pgdg

          sudo curl --fail --location \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

          echo "Types: deb" | sudo tee \
            /etc/apt/sources.list.d/pgdg.sources
          echo "URIs: https://apt.postgresql.org/pub/repos/apt" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Suites: noble-pgdg" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Components: main" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources
          echo "Signed-By: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc" | sudo tee -a \
            /etc/apt/sources.list.d/pgdg.sources

          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

          /usr/lib/postgresql/17/bin/pg_dump --version

          curl --fail --location \
            "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" \
            -o /tmp/awscliv2.zip

          unzip -q /tmp/awscliv2.zip -d /tmp
          sudo /tmp/aws/install

          aws --version

      - name: Run Supabase backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          AWS_DEFAULT_REGION: ${{ vars.AWS_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          S3_BACKUP_PREFIX: ${{ vars.S3_BACKUP_PREFIX }}
        run: |
          export PATH="/usr/lib/postgresql/17/bin:$PATH"
          bash scripts/backup_supabase.sh
