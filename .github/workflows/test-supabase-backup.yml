
name: Test Supabase Backup Connection

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-connection:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Test database connection and RLS
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail

          if [ -z "$DATABASE_URL" ]; then
            echo "Missing SUPABASE_DB_URL secret"
            exit 1
          fi

          psql "$DATABASE_URL" \
            -X -v ON_ERROR_STOP=1 \
            -c "SELECT current_user, current_database();"

          psql "$DATABASE_URL" \
            -X -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) AS athletes_count FROM public.athletes;"

          psql "$DATABASE_URL" \
            -X -v ON_ERROR_STOP=1 \
            -c "SELECT COUNT(*) AS activities_count FROM public.activities;"

psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 -c "
SELECT 'activities' AS table_name, COUNT(*) AS row_count
FROM public.activities
UNION ALL
SELECT 'athletes', COUNT(*) FROM public.athletes
UNION ALL
SELECT 'families', COUNT(*) FROM public.families
UNION ALL
SELECT 'webhook_events', COUNT(*) FROM public.webhook_events
ORDER BY table_name;
"
